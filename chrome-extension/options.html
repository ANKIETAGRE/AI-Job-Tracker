
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Job Tracker Settings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 24px;
      color: #202124;
    }
    h1 { margin-bottom: 8px; }
    p { color: #5f6368; line-height: 1.5; }
    label {
      display: block;
      margin-top: 22px;
      font-weight: 600;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
      padding: 11px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      margin-top: 24px;
      padding: 11px 18px;
      border: 0;
      border-radius: 8px;
      background: #4285F4;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    #status { margin-top: 14px; font-weight: 600; }
    code {
      background: #f1f3f4;
      padding: 2px 5px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>🚀 AI Job Tracker</h1>
  <p>
    Configure the Apps Script Web App endpoint used by the extension.
  </p>

  <label for="endpoint">Apps Script Web App URL</label>
  <input id="endpoint" placeholder="https://script.google.com/macros/s/.../exec">

  <label for="token">Access Token</label>
  <input id="token" type="password" placeholder="Your Phase 15 token">

  <button id="save">Save Settings</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
